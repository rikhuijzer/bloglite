[package]
name = "bloglite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
publish = false

[dependencies]
axum-extra = { version = "0.12", features = ["cookie"] }
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4.40", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
bloglite-auth = { path = "../bloglite-auth" }
hex = "0.4.3"
http-body-util = "0.1.3"
indoc = "2"
markdown = "1.0.0-alpha.23"
percent-encoding = "2.3"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
regex = "1.11"
reqwest = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.11"
subtle = "2.6"
syntect = { version = "5.3", default-features = false, features = ["html", "regex-fancy"] }
tar = "0.4"
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
tracing = "0.1"
xz2 = "0.1"
math-core = "0.7.0"

# For the `axum::debug_handler` enable "macros".
[dependencies.axum]
version = "0.8"
default-features = false
features = ["form", "http1", "multipart", "query", "tokio"]

[dependencies.tracing-subscriber]
version = "0.3"
default-features = false
features = ["ansi", "fmt"]

[dev-dependencies]
tower = "0.5"

[lints.clippy]
unnecessary_sort_by = "allow"
