name: ci
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
env:
  REGISTRY_IMAGE: zot.huijzer.xyz/bloglite
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Record Rust version for caching
        id: rust-version
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust-version.outputs.version }}-
      - name: Install jas
        run: |
          mkdir -p "$RUNNER_TEMP/jas"
          cd "$RUNNER_TEMP/jas"
          curl --fail --location --retry 2 \
            https://github.com/rikhuijzer/jas/releases/download/v0.4.0/jas -o jas
          sha="437b2988dbc58d5867b908bb67366b766b9bcd3ed4b266a129f8d96d75301f6e"
          printf '%s  jas\n' "$sha" | sha256sum -c -
          chmod +x jas
          printf '%s\n' "$RUNNER_TEMP/jas" >> "$GITHUB_PATH"
      - name: Install just
        run: >
          jas install
          --gh casey/just@1.40.0
          --sha d065d0df1a1f99529869fba8a5b3e0a25c1795b9007099b00dfabe29c7c1f7b6
          --gh-token ${{ secrets.GITHUB_TOKEN }}
      - run: just test

  # Based on https://docs.docker.com/build/ci/github-actions/multi-platform/.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Record Rust version for caching
        id: rust-version
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.os }}-${{ steps.rust-version.outputs.version }}-
      - name: Set up native musl dependencies
        run: |
          ARCH="$(uname -m)"
          if [[ $ARCH == "x86_64" ]]; then
            rustup target add x86_64-unknown-linux-musl
          elif [[ $ARCH == "aarch64" ]]; then
            rustup target add aarch64-unknown-linux-musl
          else
            echo "Unsupported architecture" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils
      - name: Install jas
        run: |
          mkdir -p "$RUNNER_TEMP/jas"
          cd "$RUNNER_TEMP/jas"
          curl --fail --location --retry 2 \
            https://github.com/rikhuijzer/jas/releases/download/v0.4.0/jas -o jas
          sha="437b2988dbc58d5867b908bb67366b766b9bcd3ed4b266a129f8d96d75301f6e"
          printf '%s  jas\n' "$sha" | sha256sum -c -
          chmod +x jas
          printf '%s\n' "$RUNNER_TEMP/jas" >> "$GITHUB_PATH"
      - id: just-sha
        run: |
          SHA=""
          if [ ${{ matrix.os }} == 'ubuntu-24.04-arm' ]; then
            SHA="d065d0df1a1f99529869fba8a5b3e0a25c1795b9007099b00dfabe29c7c1f7b6"
          else
            SHA="181b91d0ceebe8a57723fb648ed2ce1a44d849438ce2e658339df4f8db5f1263"
          fi
          echo "SHA=$SHA" >> $GITHUB_OUTPUT
      - run: >
          jas install
          --gh casey/just@1.40.0
          --sha ${{ steps.just-sha.outputs.SHA }}
          --gh-token ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref_type != 'tag'
        run: echo "BLOGLITE_BUILD_LABEL=dev ${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - if: github.ref_type == 'tag'
        run: echo "BLOGLITE_BUILD_LABEL=release" >> "$GITHUB_ENV"
      - run: just release
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        if: github.event_name != 'pull_request' # Also run on tag.
        with:
          registry: zot.huijzer.xyz
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name != 'pull_request' # Also run on tag.
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        if: github.event_name != 'pull_request' # Also run on tag.
      - id: platform
        run: |
          PLATFORM=""
          if [ ${{ matrix.os }} == 'ubuntu-24.04-arm' ]; then
            PLATFORM="linux/arm64"
          else
            PLATFORM="linux/amd64"
          fi
          echo "PLATFORM=$PLATFORM" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        if: github.event_name != 'pull_request' # Also run on tag.
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: './public'
          platforms: ${{ steps.platform.outputs.PLATFORM }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.vendor=Rik
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: github.event_name != 'pull_request' # Also run on tag.
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request' # Also run on tag.
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    if: github.event_name != 'pull_request' # Also run on tag.
    permissions:
      # Required by softprops/action-gh-release.
      contents: write
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Zot
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: zot.huijzer.xyz
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0 v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        id: image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            --annotation "index:org.opencontainers.image.vendor=Rik" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

          digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/image-metadata.json")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools inspect "$REGISTRY_IMAGE@$IMAGE_DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download public signing key
        run: |
          curl --fail --location --retry 2 \
            https://huijzer.xyz/files/4e9fe4f55b740878/zot-cosign.pub \
            -o "$RUNNER_TEMP/zot-cosign.pub"
          echo "4e9fe4f55b740878ce8fed101123657df7b03d80288aa3ec252dc7a4347f84b0  $RUNNER_TEMP/zot-cosign.pub" | sha256sum -c -

      - name: Sign multi-platform image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "$REGISTRY_IMAGE@$IMAGE_DIGEST"

      - name: Verify image signature
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign verify --key "$RUNNER_TEMP/zot-cosign.pub" \
            "$REGISTRY_IMAGE@$IMAGE_DIGEST"

      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        if: github.ref_type == 'tag'
        with:
          body: |
            Notable changes since the last release are documented in the [CHANGELOG.md](https://github.com/rikhuijzer/bloglite/blob/main/CHANGELOG.md) file.

            Container images are available at [zot.huijzer.xyz/image/bloglite](https://zot.huijzer.xyz/image/bloglite).
