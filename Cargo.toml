[workspace]
resolver = "2"
members = [
    "bloglite",
    "bloglite-auth",
]

[workspace.package]
version = "3.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rikhuijzer/bloglite"

[profile.dev]
debug = 0
strip = "debuginfo"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
strip = true
codegen-units = 2
opt-level = "z"
